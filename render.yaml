services:
  - type: web
    name: freshtrace
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: STAFF_PIN
        sync: false
      - key: APP_SECRET
        generateValue: true
